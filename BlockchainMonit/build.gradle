buildscript {
    repositories {
        mavenCentral()
		maven {
		  url "https://plugins.gradle.org/m2/"
		}
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:4.1.0")
        classpath "com.github.jk1:gradle-license-report:3.1.4"
    }
}
plugins {
    id "com.github.node-gradle.node" version "7.1.0"
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: "project-report"
apply plugin: "com.github.jk1.dependency-license-report"

bootJar {
    //baseName = 'BlockchainMonit'
    version = '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation group: 'com.lmax', name: 'disruptor', version:'4.0.0'
    
    compileOnly("org.springframework.boot:spring-boot-devtools")  
    implementation("org.springframework.boot:spring-boot-starter-security")
	  implementation("org.springframework.boot:spring-boot-starter-web:4.1.0")
	  implementation 'org.springframework.boot:spring-boot-starter-log4j2:4.1.0'
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:4.1.0")
    implementation("org.springframework.boot:spring-boot-starter-data-rest:4.1.0")
    implementation("org.springframework.boot:spring-boot-jackson2")

    implementation("com.h2database:h2:2.4.240")
    implementation group: 'org.modelmapper', name: 'modelmapper', version: '3.2.6'
    implementation group: 'com.microsoft.sqlserver', name: 'mssql-jdbc', version: '13.4.0.jre8'
    implementation group: 'org.modelmapper', name: 'modelmapper', version: '3.2.6'
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
    implementation group: 'com.sun.xml.bind', name: 'jaxb-core', version: '4.0.1'
    implementation group: 'com.sun.xml.bind', name: 'jaxb-impl', version: '4.0.9'
    implementation group: 'javax.activation', name: 'activation', version: '1.1.1'
    implementation group: 'org.apache.tomcat', name: 'tomcat-dbcp', version: '11.0.24'
    implementation("org.springframework.boot:spring-boot-starter-websocket:4.1.0")
    implementation("org.webjars:webjars-locator-core")
    implementation("org.webjars:sockjs-client:1.5.1")
    implementation("org.webjars:stomp-websocket:2.3.4")
    implementation("org.webjars:bootstrap:5.3.8")
    implementation("org.webjars:jquery:4.0.0")
    testImplementation('org.springframework.boot:spring-boot-starter-test:4.1.0') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}
    implementation("org.springframework.boot:spring-boot-starter-activemq:4.1.0")
    compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'
	
	testCompileOnly 'org.projectlombok:lombok:1.18.46'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
	
	implementation("com.google.code.gson:gson")
	implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
	
	implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'
	
	
}
configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}
test {
	useJUnitPlatform()
}
node {
    version = '14.15.5'
}

task buildReactApp(type: NodeTask, dependsOn: 'npmInstall') {
    script = project.file('node_modules/webpack/bin/webpack.js')
    args = [
            '--mode', 'development',
            '--entry', './src/main/webapp/javascript/Main.jsx',
            '-o', './src/main/resources/static/dist'
    ]
}

processResources.dependsOn 'buildReactApp'
clean.delete << file('node_modules')
clean.delete << file('src/main/resources/static/dist')
